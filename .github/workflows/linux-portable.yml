name: Linux portable

# Fork (diablo2-couch): the Linux tarball users download. ci.yml's Linux job
# builds on ubuntu-26.04 (the only Ubuntu with libsdl3-dev), whose package
# needs glibc 2.43: it starts on no current Mint, Ubuntu LTS or SteamOS.
# This one builds on manylinux_2_28 (AlmaLinux 8, glibc 2.28) with
# gcc-toolset, whose libstdc++ links the parts newer than the system's
# statically, so the binaries need only glibc 2.28 and GLIBCXX 3.4.25.
# SDL3 and OpenAL Soft are built from source (they dlopen X11, Wayland,
# PipeWire/Pulse/ALSA at run time), Qt is the Qt Company's own build
# (made on RHEL 8 too). Then the tarball is started on the distros people
# use: Ubuntu 24.04 (Mint 22), Debian 12, Fedora and Arch (SteamOS).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDL3_VERSION: "3.4.16"
  OPENAL_VERSION: "1.25.2"
  QT_VERSION: "6.8.3"

jobs:
  build:
    name: Linux portable (glibc 2.28)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf -y install git make perl zlib-devel bzip2-devel libcurl-devel \
            mesa-libGL-devel mesa-libEGL-devel mesa-libgbm-devel libdrm-devel \
            libX11-devel libXext-devel libXcursor-devel libXi-devel libXrandr-devel \
            libXScrnSaver-devel libXfixes-devel libXtst-devel libxkbcommon-devel \
            libxkbcommon-x11 wayland-devel wayland-protocols-devel \
            pulseaudio-libs-devel alsa-lib-devel pipewire-devel \
            systemd-devel dbus-devel \
            libxcb xcb-util xcb-util-wm xcb-util-image xcb-util-keysyms \
            xcb-util-renderutil xcb-util-cursor fontconfig freetype
          PY=/opt/python/cp312-cp312/bin
          $PY/pip install --quiet aqtinstall cmake ninja
          echo "$PY" >> "$GITHUB_PATH"
          gcc --version | head -1

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0   # git describe stamps the launcher's version

      - name: Build SDL3 and OpenAL Soft
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/src && cd /tmp/src
          curl -sSLf -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-$SDL3_VERSION.tar.gz"
          curl -sSLf -o al.tar.gz "https://github.com/kcat/openal-soft/archive/refs/tags/$OPENAL_VERSION.tar.gz"
          tar xzf sdl.tar.gz && tar xzf al.tar.gz
          cmake -S SDL3-$SDL3_VERSION -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/deps -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_WAYLAND_LIBDECOR=OFF
          cmake --build sdl-build && cmake --install sdl-build
          cmake -S openal-soft-$OPENAL_VERSION -B al-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/deps -DALSOFT_EXAMPLES=OFF -DALSOFT_UTILS=OFF \
            -DALSOFT_INSTALL_EXAMPLES=OFF -DALSOFT_INSTALL_UTILS=OFF
          cmake --build al-build && cmake --install al-build

      - name: Install Qt
        run: |
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O /opt/qt
          QT=/opt/qt/$QT_VERSION/gcc_64
          # The GTK theme plugin would pull GTK into the package; Qt's own
          # Fusion style serves the launcher.
          rm -f $QT/plugins/platformthemes/libqgtk3.so $QT/lib/cmake/Qt6Gui/Qt6QGtk3ThemePlugin*.cmake
          ls $QT/plugins/platforms

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=/opt/deps;/opt/qt/$QT_VERSION/gcc_64" \
            -DSTORM_SKIP_INSTALL=ON
          cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          # Qt's deploy (file(GET_RUNTIME_DEPENDENCIES)) resolves through the
          # binaries' rpath ($ORIGIN/lib once installed) and ldconfig's dirs,
          # not LD_LIBRARY_PATH: register the source-built SDL3/OpenAL and Qt.
          printf '%s\n' /opt/deps/lib64 /opt/deps/lib /opt/qt/$QT_VERSION/gcc_64/lib > /etc/ld.so.conf.d/d2d-deps.conf
          ldconfig
          tr ';' '\n' < build/.qt/d2d-launcher-plugins.cmake
          cmake --build build --target package
          cd build && f=$(ls d2d-*-Linux-x86_64.tar.gz) && tar tzf "$f" | sed -n '1,400p'

      - name: Highest glibc / libstdc++ the package needs
        run: |
          cd build && mkdir -p check && tar xzf d2d-*-Linux-x86_64.tar.gz -C check
          find check -type f \( -name '*.so*' -o -perm -u+x \) -exec sh -c 'file "$1" | grep -q ELF && objdump -T "$1"' _ {} \; 2>/dev/null \
            | grep -oE '(GLIBC|GLIBCXX|CXXABI)_[0-9.]+' | sort -u -V | tee needs.txt
          ! grep -E 'GLIBC_2\.(29|[3-9][0-9])' needs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: d2d-Linux
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}
          path: build/d2d-*-Linux-x86_64.tar.gz
          if-no-files-found: error

  smoke:
    name: Starts on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04   # Linux Mint 22
            setup: apt-get update -qq && apt-get install -y -qq libgl1 libegl1 libx11-6 libx11-xcb1 libxcb1 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 libwayland-client0 libwayland-cursor0 libwayland-egl1 libgbm1 libdrm2 xvfb binutils file
          - image: debian:12
            setup: apt-get update -qq && apt-get install -y -qq libgl1 libegl1 libx11-6 libx11-xcb1 libxcb1 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libgbm1 libdrm2 xvfb binutils file
          - image: archlinux:latest   # SteamOS 3 is Arch
            setup: pacman -Sy --noconfirm --needed libglvnd libx11 libxcb fontconfig freetype2 dbus glib2 wayland mesa libdrm xorg-server-xvfb binutils file
          - image: fedora:latest
            setup: dnf -y -q install libglvnd-glx libglvnd-egl libX11 libX11-xcb libxcb fontconfig freetype dbus-libs glib2 libwayland-client libwayland-cursor libwayland-egl mesa-libgbm libdrm xorg-x11-server-Xvfb binutils file
    steps:
      - name: Base libraries every desktop has
        run: ${{ matrix.setup }}
      - uses: actions/download-artifact@v4
        with:
          name: d2d-Linux
      - name: Every library resolves, d2d and the launcher start
        shell: bash
        run: |
          tar xzf d2d-*-Linux-x86_64.tar.gz && cd d2d-*-Linux-x86_64
          missing=0
          # LD_LIBRARY_PATH stands in for the binaries' rpath ($ORIGIN/lib),
          # which a bundled library itself doesn't carry.
          for f in d2d d2d-launcher d2proxy lib/*.so* plugins/*/*.so; do
            [ -f "$f" ] && file -L "$f" | grep -q ELF || continue
            if LD_LIBRARY_PATH=$PWD/lib ldd "$f" 2>/dev/null | grep 'not found'; then echo "^ $f"; missing=1; fi
          done
          ./d2d --help | head -5
          # A virtual X display: the launcher's real xcb platform plugin.
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          # Still running after 5 s = it loaded every library and plugin and
          # opened its window.
          set +e
          DISPLAY=:99 timeout 5 ./d2d-launcher; rc=$?
          set -e
          echo "launcher exit $rc"
          [ "$rc" = 124 ] && [ "$missing" = 0 ]
